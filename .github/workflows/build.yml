name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www/libs
          cp index.html www/index.html
          curl -fsSL https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js -o www/libs/peerjs.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4 -o www/libs/supabase.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js -o www/libs/three.min.js
      - run: npm install
      - run: npx cap add android
      - name: Landscape and fullscreen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<style name="AppTheme.NoActionBar"[^>]*>|&\n        <item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml
      - run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BrawlClass-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
